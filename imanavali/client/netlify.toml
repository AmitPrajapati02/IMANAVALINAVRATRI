[build]
  command = "npm run build"
  publish = "dist"

# Proxy API + uploads to Render (replace YOUR-APP with your Render service name)
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-APP.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://YOUR-APP.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/Uploads/*"
  to = "https://YOUR-APP.onrender.com/Uploads/:splat"
  status = 200
  force = true

# React Router SPA fallback (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
