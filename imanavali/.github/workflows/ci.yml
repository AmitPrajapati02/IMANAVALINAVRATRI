name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imanavali/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: imanavali/server/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  e2e-ima-donor-fee:
    runs-on: ubuntu-latest
    needs: unit
    defaults:
      run:
        working-directory: imanavali
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install server deps
        run: npm ci --prefix server
      - name: Free API port and start server
        run: |
          node scripts/free-api-port.js
          npm run start --prefix server &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/api/account/areas && break
            sleep 2
          done
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_SESSION_SECRET: ci-test-secret
          RAZORPAY_KEY: ${{ secrets.RAZORPAY_KEY }}
          RAZORPAY_SECRET: ${{ secrets.RAZORPAY_SECRET }}
      - name: E2E IMA donor fee regression
        run: npm run test:e2e --prefix server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_SESSION_SECRET: ci-test-secret
          RAZORPAY_KEY: ${{ secrets.RAZORPAY_KEY }}
          RAZORPAY_SECRET: ${{ secrets.RAZORPAY_SECRET }}
